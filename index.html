<div id="game-loading" role="status" lang="en">Loading…</div>
<script>
  window.addEventListener('error', function (event) {
    if (!document.documentElement.hasAttribute('data-game-loading')) return;
    if (!(event instanceof ErrorEvent) && !(event.target instanceof HTMLScriptElement)) return;
    const status = document.getElementById('game-loading');
    status.lang = 'zh-CN';
    status.textContent = '加载失败，请刷新重试。';
  }, true);
</script>
<div id="app">

  <!-- 背景。会变的那几张用两层叠着淡入淡出 -->
  <div id="bg" aria-hidden="true">
    <div class="bl" id="bg0"></div>
    <div class="bl" id="bg1"></div>
  </div>

  <header id="top">
    <span id="era">Gregtorio:New Horizon</span>
    <span id="env" class="dim"></span>
    <span id="topslot" class="topslot"></span>
    <span class="spacer"></span>
    <span id="invcount" class="dim"></span>
    <button id="dropopen" data-drop-open>掉落物</button>
    <button id="trashopen" data-trash-open aria-label="垃圾桶" data-tip="垃圾桶"><svg width="16" height="18" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5h16M7 5V2h6v3M4 5l1 15h10l1-15M8 8v9m4-9v9"/></svg></button>
    <button id="msgopen" data-msgx="open" title="消息栏">消息</button>
    <button id="save-error" hidden data-save-retry>保存失败，点击重试</button>
    <button id="saveopen" data-save-open aria-controls="save-slots" aria-expanded="false"><span>存档</span><span class="save-current-name"></span><span aria-hidden="true">▾</span></button>
  </header>

  <div id="body">
    <aside id="nav">
      <nav id="nav-pages" aria-label="页面"></nav>
      <div id="tool-dock" role="group" aria-label="工具栏">
        <div class="tool-dock-slots"><div id="toolbar"></div></div>
        <button class="btn tool-management-button" type="button" data-wp-tools="1" aria-label="工具管理" data-tip="工具管理"></button>
      </div>
    </aside>

    <main id="main">

      <!-- 世界：地图和地点操作共用一个视图，动作队列在顶栏。 -->
      <section class="page" id="page-world">
        <div id="worldleft">
          <div class="world-map-grid">
            <div id="dimtabs"></div>
            <div id="world-map-stage" aria-label="世界地图" role="group" hidden>
              <div id="world-map-frame">
                <div id="world-map-art" aria-hidden="true"></div>
                <div id="world-map-targets"></div>
              </div>
            </div>
            <div class="panel" id="world-actions-panel">
              <div id="slot"></div>
              <header id="world-actions-heading" hidden>
                <h2 id="world-region-title" aria-live="polite"></h2>
                <button type="button" id="world-actions-close" class="btn" aria-label="收起行动">×</button>
              </header>
              <div id="actions"></div>
            </div>
          </div>
          <div class="panel" id="world-fieldwork"><h2 class="ui-inline-title"><span data-ui-glyph="settings"></span>就地加工</h2><div id="fieldwork"></div></div>
        </div>
      </section>

      <!-- 2 合成：图鉴 -->
      <section class="page craft" id="page-craft" hidden>
        <div id="catbar">
          <span data-ui-glyph="search" aria-hidden="true"></span>
          <input id="q" type="text" autocomplete="off"
                 placeholder="搜索：汉字 / 全拼 / 首字母　（qtb → 青铜板）">
          <button type="button" class="btn" id="craft-search-clear" title="清空搜索" aria-label="清空合成搜索">×</button>
        </div>
        <div id="catbody">
          <div id="catleft">
            <div class="catleft-heading"><span>物品图鉴</span><button type="button" class="btn" id="craft-refresh" title="刷新可合成排序" aria-label="刷新可合成排序">↻</button></div>
            <div id="itemlist"></div>
            <div id="catfoot">
              <span id="tabs"></span>
              <span class="matrix-scroll-hint">按住shift+滚轮可以左右滚动</span>
              <span id="pager"></span>
            </div>
          </div>
          <div id="craft-workspace"><section id="manual-workbench" aria-label="手动摆放"></section><div id="detail"></div></div>
          <div id="catright">
            <h3><span data-ui-glyph="clock" aria-hidden="true"></span>查看历史</h3>
            <div id="history"></div>
          </div>
        </div>
      </section>

      <!-- 3 仓库：箱子各装各的，在这儿拖东西进去 -->
      <section class="page" id="page-chest" hidden>
        <div class="panel" id="chestpage"></div>
      </section>

      <!-- 4 农业 -->
      <section class="page" id="page-agri" hidden>
        <div id="farm-host"></div>
      </section>

      <!-- 4 机器：小作坊（区 / 发电区 / 机器区 / 槽位），内容由 workshop.js 画 -->
      <section class="page" id="page-machine" hidden>
        <div id="ws-host"></div>
      </section>

      <!-- 5 产线：厂房，机器自己摆，管道自己走 -->
      <section class="page" id="page-line" hidden>
        <div id="fx-host"></div>
      </section>

      <!-- 6 设置：调试 -->
      <section class="page" id="page-space" hidden><div id="space-host"></div></section>
      <section class="page" id="page-settings" hidden>
        <div class="panel">
          <header class="settings-intro">
            <div class="settings-intro-main">
              <div class="ui-section-title"><span data-ui-item="minecraft:comparator@0"></span><div><h2>设置</h2></div></div>
              <button type="button" id="player-manual-open" class="btn settings-manual-open" aria-haspopup="dialog" aria-controls="player-manual"><span data-ui-glyph="book"></span>Gregtorio使用手册</button>
            </div>
            <a class="settings-author" href="https://github.com/yotsuba148" target="_blank" rel="noopener noreferrer" title="GitHub 主页">
              <span>作者 大梦阐释者</span>
              <span lang="en">Made by PhantasDream</span>
            </a>
          </header>
          <section class="settings-card">
            <h3 class="settings-heading"><span data-ui-glyph="monitor"></span>界面缩放</h3>
            <div id="zoombox"></div>
          </section>
          <section class="settings-card">
            <h3 class="settings-heading"><span data-ui-glyph="grid"></span>外观</h3>
            <div id="appearance-settings"></div>
          </section>
          <details class="settings-card settings-developer">
            <summary><span data-ui-glyph="terminal"></span>开发者工具</summary>
            <h3 class="sub">调试</h3>
            <div id="dbgbox"></div>
            <div id="developer-commands" hidden>
            <h3 class="sub">指令</h3>
            <div id="cmdbar">
              <input id="cmd" type="text" autocomplete="off" spellcheck="false"
                     placeholder="输 help 查看指令">
              <button class="btn" data-cmdrun="1">执行</button>
            </div>
            <div id="cmdlog"></div>
            </div>
          </details>
        </div>
      </section>

    </main>
    <!-- 网页正下方的小提示：东西进仓库了。挂在这儿是为了正好压在物品栏上面 -->
    <div id="gainbox"></div>
  </div>

  <aside id="quests">
    <h2>
      <span class="reference-tabs" role="tablist" aria-label="右侧工具"><button data-side-view="quests" role="tab" class="on">任务书</button><button data-side-view="jei" role="tab">JEI</button></span>
      <span class="dim" id="questcount"></span>
      <span class="spacer"></span>
      <button id="qclose" data-qx="close" title="收起任务书">›</button>
    </h2>
    <!-- 章节做成顶部一坨标签，固定不滚：9 个章节任何时候都在，谁也挤不走谁 -->
    <nav id="questchaps"></nav>
    <div id="questfinder" hidden>
      <input id="quest-search" type="search" aria-label="搜索任务书" placeholder="搜任务、材料、正文或 ID" autocomplete="off">
      <button type="button" id="quest-search-ready" aria-pressed="false">可确认</button>
      <div id="quest-search-results" hidden></div>
    </div>
    <div id="questtreepanel">
      <div id="questlist"></div>
      <nav id="questmarkers" aria-label="跳到任务"></nav>
    </div>
    <div id="jei" hidden></div>
    </aside>

  <!-- 鼠标停在任务上时冒出来的需求详情。是普通 div，不是浏览器弹窗。 -->
  <div id="qtip" hidden></div>
  <!-- 任务书收起以后露出来的把手，贴在右边 -->
  <button id="qopen" data-qx="open" title="展开任务书">任务书</button>

  <footer id="bottom" aria-label="物品栏">
    <div id="inventory"></div>
  </footer>

  <div id="popup" hidden></div>
  <dialog id="player-manual" aria-labelledby="player-manual-title">
    <header class="player-manual-head">
      <h2 id="player-manual-title">Gregtorio使用手册</h2>
      <form method="dialog"><button class="btn" autofocus>关闭</button></form>
    </header>
    <section id="player-manual-list" tabindex="0" aria-label="手册正文"></section>
  </dialog>
  <!-- 消息栏：永远压在最上层，任何页面都能翻。破了工具、缺了料这类事都记在这里 -->
  <aside id="msgs" hidden>
    <h2>
      <span>消息</span>
      <span class="dim" id="msgcount"></span>
      <span class="spacer"></span>
      <button id="msgclear" data-msgx="clear" title="清空消息">清空</button>
      <button id="msgclose" data-msgx="close" title="收起">×</button>
    </h2>
    <div id="msglist"></div>
  </aside>
  <!-- 点哪儿冒哪儿的小提示，1.6 秒自己消失。也不是浏览器弹窗。 -->
  <div id="toast"></div>
</div>

<div id="weather-particles" aria-hidden="true" hidden></div>
